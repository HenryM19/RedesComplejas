[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "templates-library"
version = "0.1.0"
description = "Herramientas Python para crear proyectos, organizar resultados y convertir Markdown a LaTeX."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Henry Maldonado" }
]
keywords = [
    "templates",
    "project-generator",
    "latex",
    "markdown",
    "automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
create_project = "templates_library.modulos.proyectos:main"
create-project = "templates_library.modulos.proyectos:main"
crear_proyecto = "templates_library.modulos.proyectos:main"
crear-proyecto = "templates_library.modulos.proyectos:main"
guardar_imagen = "templates_library.modulos.resultados:main_guardar_imagen"
guardar-imagen = "templates_library.modulos.resultados:main_guardar_imagen"
guardar_informe = "templates_library.modulos.resultados:main_guardar_informe"
guardar-informe = "templates_library.modulos.resultados:main_guardar_informe"
guardar_md = "templates_library.modulos.resultados:main_guardar_md"
guardar-md = "templates_library.modulos.resultados:main_guardar_md"
crear_estructura_resultados = "templates_library.modulos.resultados:main_crear_estructura_resultados"
crear-estructura-resultados = "templates_library.modulos.resultados:main_crear_estructura_resultados"
listar_resultados = "templates_library.modulos.resultados:main_listar_resultados"
listar-resultados = "templates_library.modulos.resultados:main_listar_resultados"
md_a_latex = "templates_library.modulos.conversion:main"
md-a-latex = "templates_library.modulos.conversion:main"

[project.urls]
Homepage = "https://github.com/henrr/Templates_Library"
Repository = "https://github.com/henrr/Templates_Library"
Issues = "https://github.com/henrr/Templates_Library/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
templates_library = [
    "templates/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["E701", "E702"]
